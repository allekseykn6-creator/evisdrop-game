<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CaseDrop — скины CS2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0f1419;
  --panel: #1c2430;
  --panel-2: #242e3c;
  --border: #2c3847;
  --text: #e8eaed;
  --text-dim: #8b95a5;
  --accent: #ff6b35;
  --accent-2: #ff8c42;
  --green: #4ade80;
  --r-consumer: #b0c3d9;
  --r-industrial: #5e98d9;
  --r-milspec: #4b69ff;
  --r-restricted: #8847ff;
  --r-classified: #d32ce6;
  --r-covert: #eb4b4b;
  --r-knife: #ffd700;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body {
  background: radial-gradient(ellipse at top, #1a2330 0%, #0f1419 60%);
  background-attachment: fixed;
  padding-bottom: 40px;
}

/* ===== Header ===== */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(15, 20, 25, 0.85);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.brand {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.5px;
}
.brand span { color: var(--accent); }
.user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-dim);
}
.balance {
  background: linear-gradient(135deg, #2a3a1e, #3a4a2e);
  border: 1px solid #4a6a2e;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 700;
  color: #b8e986;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.balance::before { content: '🪙'; }
.btn-topup {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  transition: 0.15s;
}
.btn-topup:hover { background: var(--accent-2); }
.btn-topup:active { transform: scale(0.96); }

/* ===== Main ===== */
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }
h2 {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin: 24px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
h2::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ===== Cases grid ===== */
.cases-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}
.case-card {
  background: linear-gradient(160deg, var(--panel), var(--panel-2));
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: 0.2s;
  position: relative;
  overflow: hidden;
}
.case-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(255,107,53,0.15), transparent 60%);
  opacity: 0;
  transition: 0.2s;
}
.case-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.case-card:hover::before { opacity: 1; }
.case-emoji { font-size: 48px; line-height: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
.case-name { font-weight: 700; font-size: 15px; text-align: center; }
.case-price {
  font-size: 13px;
  color: var(--green);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
}
.case-price::before { content: '🪙'; }
.case-open {
  width: 100%;
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 10px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  transition: 0.15s;
  margin-top: 4px;
}
.case-open:hover { background: var(--accent-2); }
.case-open:disabled {
  background: var(--panel-2);
  color: var(--text-dim);
  cursor: not-allowed;
}

/* ===== Inventory ===== */
.inventory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.inv-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  transition: 0.15s;
}
.inv-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 10px 0 0 10px;
  background: var(--rarity-color, var(--border));
  box-shadow: 0 0 12px var(--rarity-color, transparent);
}
.inv-item .emoji { font-size: 32px; text-align: center; }
.inv-item .name { font-size: 12px; font-weight: 600; text-align: center; min-height: 28px; }
.inv-item .sell-btn {
  background: #2c1e1e;
  color: #ff8a8a;
  border: 1px solid #4a2e2e;
  padding: 6px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.15s;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4px;
}
.inv-item .sell-btn:hover { background: #4a2e2e; color: #ffb8b8; }
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
  font-size: 14px;
  border: 1px dashed var(--border);
  border-radius: 12px;
}

/* Rarity colors */
.r-consumer    { --rarity-color: var(--r-consumer); }
.r-industrial  { --rarity-color: var(--r-industrial); }
.r-milspec     { --rarity-color: var(--r-milspec); }
.r-restricted  { --rarity-color: var(--r-restricted); }
.r-classified  { --rarity-color: var(--r-classified); }
.r-covert      { --rarity-color: var(--r-covert); }
.r-knife       { --rarity-color: var(--r-knife); }

/* ===== Modal / Roulette ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.active { display: flex; }
.roulette-wrap {
  width: 100%;
  max-width: 900px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  padding: 24px 0;
}
.roulette-pointer {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent);
  transform: translateX(-50%);
  z-index: 5;
  box-shadow: 0 0 12px var(--accent), 0 0 24px var(--accent);
  pointer-events: none;
}
.roulette-pointer::before, .roulette-pointer::after {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
}
.roulette-pointer::before {
  top: -4px;
  border-top-color: var(--accent);
}
.roulette-pointer::after {
  bottom: -4px;
  border-bottom-color: var(--accent);
}
.roulette-container {
  width: 100%;
  overflow: hidden;
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.roulette-strip {
  display: flex;
  gap: 8px;
  will-change: transform;
  padding: 4px 0;
}
.roulette-strip.animating {
  transition: transform 5.5s cubic-bezier(0.12, 0.8, 0.15, 1);
}
.roulette-item {
  flex-shrink: 0;
  width: 120px;
  height: 150px;
  background: var(--panel-2);
  border: 2px solid var(--rarity-color, var(--border));
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px;
  position: relative;
  overflow: hidden;
}
.roulette-item::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: var(--rarity-color, var(--border));
}
.roulette-item .emoji { font-size: 38px; }
.roulette-item .name {
  font-size: 10px;
  font-weight: 600;
  text-align: center;
  line-height: 1.2;
  color: var(--text);
}
.roulette-item.winner {
  box-shadow: 0 0 20px var(--rarity-color), 0 0 40px var(--rarity-color);
}

.result-info {
  margin-top: 20px;
  text-align: center;
  min-height: 60px;
}
.result-info .won-label {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 700;
}
.result-info .won-name {
  font-size: 20px;
  font-weight: 800;
  margin-top: 4px;
}
.result-info .won-price {
  font-size: 14px;
  color: var(--green);
  font-weight: 700;
  margin-top: 4px;
}
.result-info .won-price::before { content: '🪙 '; }
.btn-close-modal {
  margin-top: 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 12px 40px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: 0.15s;
}
.btn-close-modal:hover { background: var(--accent-2); }
.btn-close-modal:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 10px 20px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  transition: 0.3s;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--r-covert); color: var(--r-covert); }
</style>
</head>
<body>

<header>
  <div class="brand">Case<span>Drop</span></div>
  <div class="user-info">
    <span id="userName"></span>
    <div class="balance" id="balance">1000</div>
    <button class="btn-topup" onclick="topUp()">+1000</button>
  </div>
</header>

<main>
  <h2>Кейсы</h2>
  <div class="cases-grid" id="casesGrid"></div>

  <h2>Инвентарь <span id="invCount" style="color:var(--text-dim);font-weight:400;font-size:12px;"></span></h2>
  <div class="inventory-grid" id="inventoryGrid"></div>
</main>

<!-- Roulette Modal -->
<div class="modal" id="openingModal">
  <div class="roulette-wrap">
    <div class="roulette-pointer"></div>
    <div class="roulette-container" id="rouletteContainer">
      <div class="roulette-strip" id="rouletteStrip"></div>
    </div>
  </div>
  <div class="result-info" id="resultInfo"></div>
  <button class="btn-close-modal" id="closeModalBtn" disabled>Забрать</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ДАННЫЕ: КЕЙСЫ И СКИНЫ
   ========================================================= */
const CASES = [
  {
    id: 'starter',
    name: 'Стартовый кейс',
    emoji: '📦',
    price: 100,
    items: [
      { name: 'P250 | Песок',            rarity: 'consumer',   value: 20,    emoji: '🔫', weight: 40   },
      { name: 'MP9 | Пыль',              rarity: 'consumer',   value: 25,    emoji: '💥', weight: 25   },
      { name: 'Five-SeveN | Кобальт',    rarity: 'industrial', value: 60,    emoji: '🔫', weight: 15   },
      { name: 'Galil AR | Синий',        rarity: 'industrial', value: 80,    emoji: '🎯', weight: 8    },
      { name: 'SG 553 | Волна',          rarity: 'milspec',    value: 200,   emoji: '🎯', weight: 8    },
      { name: 'AK-47 | Синий ламинат',   rarity: 'restricted', value: 600,   emoji: '🎯', weight: 3.5  },
      { name: 'AWP | Азимов',            rarity: 'classified', value: 2000,  emoji: '🏹', weight: 0.45 },
      { name: '★ Нож-бабочка | Градиент',rarity: 'knife',      value: 15000, emoji: '🔪', weight: 0.05 },
    ]
  },
  {
    id: 'standard',
    name: 'Боевой кейс',
    emoji: '🎁',
    price: 500,
    items: [
      { name: 'Glock-18 | Пустыня',      rarity: 'consumer',   value: 100,   emoji: '🔫', weight: 25   },
      { name: 'UMP-45 | Лабиринт',       rarity: 'consumer',   value: 120,   emoji: '💥', weight: 20   },
      { name: 'Desert Eagle | Бронза',   rarity: 'industrial', value: 300,   emoji: '🔫', weight: 20   },
      { name: 'M4A4 | Пустыня',          rarity: 'industrial', value: 350,   emoji: '🎯', weight: 15   },
      { name: 'AK-47 | Красная линия',   rarity: 'milspec',    value: 800,   emoji: '🎯', weight: 12   },
      { name: 'M4A1-S | Синий гром',     rarity: 'restricted', value: 2500,  emoji: '🎯', weight: 6    },
      { name: 'AWP | Электрик',          rarity: 'classified', value: 8000,  emoji: '🏹', weight: 1.7  },
      { name: '★ Штык-нож | Кровавая паутина', rarity: 'knife', value: 40000, emoji: '🔪', weight: 0.3  },
    ]
  },
  {
    id: 'premium',
    name: 'Элитный кейс',
    emoji: '💎',
    price: 1500,
    items: [
      { name: 'MP7 | Кобальт',            rarity: 'industrial', value: 500,   emoji: '💥', weight: 20   },
      { name: 'FAMAS | Ночная',           rarity: 'industrial', value: 600,   emoji: '🎯', weight: 20   },
      { name: 'M4A4 | Гриффон',           rarity: 'milspec',    value: 1500,  emoji: '🎯', weight: 25   },
      { name: 'AK-47 | Неонуар',          rarity: 'milspec',    value: 2000,  emoji: '🎯', weight: 18   },
      { name: 'AWP | Феникс',             rarity: 'restricted', value: 6000,  emoji: '🏹', weight: 12   },
      { name: 'Desert Eagle | Принтстрим',rarity: 'classified', value: 15000, emoji: '🔫', weight: 4.5  },
      { name: '★ Керамбит | Синий',       rarity: 'knife',      value: 80000, emoji: '🗡️', weight: 0.5  },
    ]
  },
  {
    id: 'legendary',
    name: 'Легендарный кейс',
    emoji: '👑',
    price: 5000,
    items: [
      { name: 'AWP | Гиперзверь',         rarity: 'restricted', value: 12000,  emoji: '🏹', weight: 30   },
      { name: 'AK-47 | Огненный змей',    rarity: 'restricted', value: 15000,  emoji: '🎯', weight: 25   },
      { name: 'M4A4 | Кактус',            rarity: 'classified', value: 35000,  emoji: '🎯', weight: 20   },
      { name: 'Desert Eagle | Кровавая паутина', rarity: 'classified', value: 45000, emoji: '🔫', weight: 15 },
      { name: 'AWP | Драконье пламя',     rarity: 'covert',     value: 120000, emoji: '🏹', weight: 8    },
      { name: '★ Керамбит | Градиент',    rarity: 'knife',      value: 200000, emoji: '🗡️', weight: 1.5  },
      { name: '★ Нож-бабочка | Синий',    rarity: 'knife',      value: 250000, emoji: '🔪', weight: 0.5  },
    ]
  }
];

/* =========================================================
   TELEGRAM
   ========================================================= */
const tg = window.Telegram?.WebApp;
let userId = 'guest';
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.initDataUnsafe?.user) {
    userId = String(tg.initDataUnsafe.user.id);
    const name = tg.initDataUnsafe.user.first_name || tg.initDataUnsafe.user.username || 'Игрок';
    document.getElementById('userName').textContent = name;
  }
}

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
const STORAGE_KEY = 'casedrop_state_' + userId;
let state = { balance: 1000, inventory: [] };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) { console.warn('load failed', e); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { console.warn('save failed', e); }
}

/* =========================================================
   UI
   ========================================================= */
function renderBalance() {
  document.getElementById('balance').textContent = state.balance.toLocaleString('ru-RU');
}

function renderCases() {
  const grid = document.getElementById('casesGrid');
  grid.innerHTML = '';
  for (const c of CASES) {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.innerHTML = `
      <div class="case-emoji">${c.emoji}</div>
      <div class="case-name">${c.name}</div>
      <div class="case-price">${c.price.toLocaleString('ru-RU')}</div>
      <button class="case-open" ${state.balance < c.price ? 'disabled' : ''}>Открыть</button>
    `;
    card.querySelector('.case-open').addEventListener('click', (e) => {
      e.stopPropagation();
      openCase(c.id);
    });
    grid.appendChild(card);
  }
}

function renderInventory() {
  const grid = document.getElementById('inventoryGrid');
  const count = document.getElementById('invCount');
  count.textContent = `(${state.inventory.length})`;
  grid.innerHTML = '';
  if (state.inventory.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Инвентарь пуст. Открой первый кейс!</div>';
    return;
  }
  state.inventory.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = `inv-item r-${item.rarity}`;
    el.innerHTML = `
      <div class="emoji">${item.emoji}</div>
      <div class="name">${item.name}</div>
      <button class="sell-btn">Продать · ${item.value.toLocaleString('ru-RU')} 🪙</button>
    `;
    el.querySelector('.sell-btn').addEventListener('click', () => sellItem(idx));
    grid.appendChild(el);
  });
}

function renderAll() {
  renderBalance();
  renderCases();
  renderInventory();
}

/* =========================================================
   ЛОГИКА
   ========================================================= */
function pickWeighted(items) {
  const total = items.reduce((s, i) => s + i.weight, 0);
  let r = Math.random() * total;
  for (const item of items) {
    r -= item.weight;
    if (r <= 0) return item;
  }
  return items[items.length - 1];
}

function topUp() {
  state.balance += 1000;
  saveState();
  renderBalance();
  renderCases();
  toast('+1000 🪙', 'success');
}

function sellItem(idx) {
  const item = state.inventory[idx];
  if (!item) return;
  state.balance += item.value;
  state.inventory.splice(idx, 1);
  saveState();
  renderAll();
  toast(`+${item.value.toLocaleString('ru-RU')} 🪙`, 'success');
}

/* =========================================================
   ОТКРЫТИЕ КЕЙСА
   ========================================================= */
let isOpening = false;

function openCase(caseId) {
  if (isOpening) return;
  const caseData = CASES.find(c => c.id === caseId);
  if (!caseData) return;
  if (state.balance < caseData.price) {
    toast('Недостаточно монет', 'error');
    return;
  }
  isOpening = true;

  state.balance -= caseData.price;
  const winner = pickWeighted(caseData.items);

  // Сразу добавляем в инвентарь
  state.inventory.push({
    name: winner.name,
    rarity: winner.rarity,
    value: winner.value,
    emoji: winner.emoji
  });
  saveState();
  renderBalance();
  renderCases();

  // Показываем модалку
  const modal = document.getElementById('openingModal');
  const strip = document.getElementById('rouletteStrip');
  const container = document.getElementById('rouletteContainer');
  const resultInfo = document.getElementById('resultInfo');
  const closeBtn = document.getElementById('closeModalBtn');

  modal.classList.add('active');
  resultInfo.innerHTML = '';
  closeBtn.disabled = true;
  closeBtn.textContent = 'Крутим...';

  // Строим ленту (70 слотов, победитель на позиции 60)
  const TOTAL = 70;
  const WIN_INDEX = 60;
  strip.innerHTML = '';
  strip.classList.remove('animating');
  strip.style.transform = 'translateX(0)';

  for (let i = 0; i < TOTAL; i++) {
    const item = (i === WIN_INDEX) ? winner : pickWeighted(caseData.items);
    const el = document.createElement('div');
    el.className = `roulette-item r-${item.rarity}`;
    el.innerHTML = `<div class="emoji">${item.emoji}</div><div class="name">${item.name}</div>`;
    strip.appendChild(el);
  }

  // Расчёт цели
  const itemWidth = 120;
  const gap = 8;
  const step = itemWidth + gap;
  const containerWidth = container.clientWidth;
  const winnerCenter = WIN_INDEX * step + itemWidth / 2;
  const randomOffset = (Math.random() - 0.5) * (itemWidth * 0.6);
  const targetX = containerWidth / 2 - winnerCenter + randomOffset;

  // Форсируем рефлоу, чтобы transition сработал
  void strip.offsetWidth;

  requestAnimationFrame(() => {
    strip.classList.add('animating');
    strip.style.transform = `translateX(${targetX}px)`;
  });

  // По завершении — подсветка и инфо
  const onEnd = () => {
    strip.removeEventListener('transitionend', onEnd);
    const winnerEl = strip.children[WIN_INDEX];
    if (winnerEl) winnerEl.classList.add('winner');

    const rarityLabel = {
      consumer: 'Обычный',
      industrial: 'Промышленный',
      milspec: 'Армейский',
      restricted: 'Запрещённый',
      classified: 'Засекреченный',
      covert: 'Тайный',
      knife: '★ Редкий специальный'
    }[winner.rarity] || '';

    resultInfo.innerHTML = `
      <div class="won-label">${rarityLabel}</div>
      <div class="won-name">${winner.emoji} ${winner.name}</div>
      <div class="won-price">${winner.value.toLocaleString('ru-RU')}</div>
    `;
    closeBtn.disabled = false;
    closeBtn.textContent = 'Забрать';

    // Обновляем инвентарь под модалкой
    renderInventory();
    isOpening = false;
  };
  strip.addEventListener('transitionend', onEnd);

  // Fallback на случай отсутствия transitionend
  setTimeout(() => {
    if (isOpening) { isOpening = false; onEnd(); }
  }, 6000);
}

document.getElementById('closeModalBtn').addEventListener('click', () => {
  const modal = document.getElementById('openingModal');
  modal.classList.remove('active');
  const strip = document.getElementById('rouletteStrip');
  strip.classList.remove('animating');
  strip.style.transform = 'translateX(0)';
  document.getElementById('rouletteStrip').innerHTML = '';
  document.getElementById('resultInfo').innerHTML = '';
  renderAll();
});

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* =========================================================
   INIT
   ========================================================= */
loadState();
renderAll();
</script>
</body>
</html>
