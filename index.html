<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CaseDrop — CS2 & NFT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0a0d12;
  --panel: #151a24;
  --panel-2: #1f2735;
  --border: #2a3548;
  --text: #e8eaed;
  --text-dim: #8b95a5;
  --accent: #ff6b35;
  --green: #4ade80;
  --r-consumer: #b0c3d9;
  --r-industrial: #5e98d9;
  --r-milspec: #4b69ff;
  --r-restricted: #8847ff;
  --r-classified: #d32ce6;
  --r-covert: #eb4b4b;
  --r-knife: #ffd700;
  --header-h: 56px;
  --nav-h: 60px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body {
  background: radial-gradient(circle at top, #1a2330 0%, #0a0d12 70%);
  background-attachment: fixed;
  padding-bottom: calc(var(--nav-h) + 20px);
  padding-top: var(--header-h);
}

/* ===== Header ===== */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(10, 13, 18, 0.85);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { font-weight: 900; font-size: 20px; letter-spacing: 1px; }
.brand span { color: var(--accent); }
.user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
.balance {
  background: linear-gradient(135deg, #1e2e14, #2d421e);
  border: 1px solid #426b26;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 700;
  color: #b8e986;
  display: flex; align-items: center; gap: 6px;
}
.balance::before { content: '🪙'; }

/* ===== Main ===== */
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }
h2 { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
h2::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ===== Navigation ===== */
nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: rgba(10, 13, 18, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 60;
  padding: 0 8px;
}
.nav-btn {
  background: none; border: none; color: var(--text-dim);
  font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
  transition: 0.2s;
}
.nav-btn.active { color: var(--accent); }
.nav-btn .icon { font-size: 20px; }

/* ===== Pages ===== */
.page { display: none; }
.page.active { display: block; }

/* ===== Cases grid ===== */
.cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.case-card {
  background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  position: relative; overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  transition: 0.2s;
}
.case-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.5;
}
.case-emoji { font-size: 56px; filter: drop-shadow(0 8px 16px rgba(255,107,53,0.4)); }
.case-name { font-weight: 800; font-size: 15px; text-align: center; }
.case-price { font-size: 14px; color: var(--green); font-weight: 800; display: flex; align-items: center; gap: 4px; }
.case-price::before { content: '🪙'; }
.case-open {
  width: 100%; background: linear-gradient(90deg, var(--accent), #ff8c42);
  border: none; color: #fff; padding: 12px; border-radius: 10px;
  font-weight: 800; font-size: 14px; margin-top: 8px;
  box-shadow: 0 4px 12px rgba(255,107,53,0.3);
  cursor: pointer;
}
.case-open:disabled { background: var(--panel-2); color: var(--text-dim); box-shadow: none; cursor: not-allowed; }

/* ===== Inventory ===== */
.inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.inv-item {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative;
}
.inv-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: 12px 0 0 12px; background: var(--rarity-color, var(--border));
  box-shadow: 0 0 10px var(--rarity-color);
}
.inv-item .emoji { font-size: 28px; text-align: center; }
.inv-item .name { font-size: 11px; font-weight: 700; text-align: center; min-height: 26px; line-height: 1.2; }
.inv-item .sell-btn { background: rgba(235, 75, 75, 0.1); color: #ff8a8a; border: 1px solid rgba(235, 75, 75, 0.3); padding: 6px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 12px; grid-column: 1/-1; }

/* Rarity colors */
.r-consumer    { --rarity-color: var(--r-consumer); }
.r-industrial  { --rarity-color: var(--r-industrial); }
.r-milspec     { --rarity-color: var(--r-milspec); }
.r-restricted  { --rarity-color: var(--r-restricted); }
.r-classified  { --rarity-color: var(--r-classified); }
.r-covert      { --rarity-color: var(--r-covert); }
.r-knife       { --rarity-color: var(--r-knife); }

/* ===== Loading & Error ===== */
.loading-state { text-align: center; padding: 40px; color: var(--text-dim); }
.spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-state { text-align: center; padding: 40px; color: var(--r-covert); border: 1px dashed var(--r-covert); border-radius: 12px; }
.error-state button { margin-top: 12px; background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }

/* ===== CS2 Catalog ===== */
.catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.catalog-item {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  position: relative; overflow: hidden;
}
.catalog-item::before {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: var(--rarity-color, var(--border));
}
.catalog-item img { width: 80px; height: 60px; object-fit: contain; }
.catalog-item .name { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.2; }
.catalog-item .price { font-size: 12px; color: var(--green); font-weight: 800; }

/* ===== NFT Placeholder ===== */
.nft-placeholder { text-align: center; padding: 40px 20px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 12px; }
.nft-placeholder .icon { font-size: 48px; margin-bottom: 16px; }
.nft-placeholder h3 { color: var(--text); margin-bottom: 8px; }
.nft-placeholder p { font-size: 14px; line-height: 1.5; max-width: 400px; margin: 0 auto; }

/* ===== Upgrader (заглушка) ===== */
.upgrader-placeholder { text-align: center; padding: 40px; color: var(--text-dim); }

/* Toast */
.toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--panel-2); border: 1px solid var(--border); padding: 10px 20px;
  border-radius: 10px; font-weight: 700; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--r-covert); color: var(--r-covert); }
</style>
</head>
<body>

<header>
  <div class="brand">Case<span>Drop</span></div>
  <div class="user-info">
    <div class="balance" id="balance">1000</div>
  </div>
</header>

<main>
  <!-- Страница: Главная (Кейсы) -->
  <div id="page-home" class="page active">
    <h2>Кейсы</h2>
    <div class="cases-grid" id="casesGrid"></div>
  </div>

  <!-- Страница: Каталог CS2 -->
  <div id="page-cs2" class="page">
    <h2>Каталог CS2</h2>
    <div id="cs2Content">
      <div class="loading-state" id="cs2Loading"><div class="spinner"></div><p style="margin-top:12px;">Загрузка скинов...</p></div>
      <div id="cs2Error" class="error-state" style="display:none;"></div>
      <div class="catalog-grid" id="cs2Grid" style="display:none;"></div>
    </div>
  </div>

  <!-- Страница: NFT Gifts -->
  <div id="page-nft" class="page">
    <h2>NFT Gifts</h2>
    <div class="nft-placeholder">
      <div class="icon">🎁</div>
      <h3>NFT Подарки</h3>
      <p>Для работы с NFT-подарками требуется серверная валидация <code>initData</code> и интеграция с TON Connect. Интерфейс готов к подключению бэкенда.</p>
    </div>
  </div>

  <!-- Страница: Апгрейдер -->
  <div id="page-upgrader" class="page">
    <h2>Апгрейдер</h2>
    <div class="upgrader-placeholder">
      <p>Апгрейдер будет доступен в следующей части.</p>
    </div>
  </div>

  <!-- Страница: Профиль -->
  <div id="page-profile" class="page">
    <h2>Профиль и Инвентарь</h2>
    <div class="inventory-grid" id="inventoryGrid"></div>
  </div>
</main>

<nav>
  <button class="nav-btn active" data-page="home"><span class="icon">🏠</span>Главная</button>
  <button class="nav-btn" data-page="cs2"><span class="icon">🔫</span>CS2</button>
  <button class="nav-btn" data-page="nft"><span class="icon">🎁</span>NFT</button>
  <button class="nav-btn" data-page="upgrader"><span class="icon">⬆️</span>Апгрейд</button>
  <button class="nav-btn" data-page="profile"><span class="icon">👤</span>Профиль</button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ===== Telegram =====
const tg = window.Telegram?.WebApp;
let userId = 'guest';
if (tg) {
  tg.ready(); tg.expand();
  if (tg.initDataUnsafe?.user) userId = String(tg.initDataUnsafe.user.id);
}

// ===== State =====
const STORAGE_KEY = 'casedrop_state_' + userId;
let state = { balance: 1000, inventory: [] };

function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) state = JSON.parse(raw); } catch(e) {}
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }

// ===== UI Helpers =====
function renderBalance() { document.getElementById('balance').textContent = state.balance.toLocaleString('ru-RU'); }

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show ' + type;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ===== Navigation =====
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    
    if (btn.dataset.page === 'cs2') loadCS2Catalog();
    if (btn.dataset.page === 'profile') renderInventory();
  });
});

// ===== CS2 Catalog (Real API) =====
let cs2Loaded = false;
const CS2_API = 'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/ru/skins.json';

async function loadCS2Catalog() {
  if (cs2Loaded) return;
  const loading = document.getElementById('cs2Loading');
  const errorEl = document.getElementById('cs2Error');
  const grid = document.getElementById('cs2Grid');
  
  loading.style.display = 'block';
  errorEl.style.display = 'none';
  grid.style.display = 'none';

  try {
    const res = await fetch(CS2_API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const skins = await res.json();
    
    // Берем первые 60 скинов для примера (можно добавить пагинацию)
    const sample = skins.slice(0, 60);
    grid.innerHTML = '';
    sample.forEach(skin => {
      const el = document.createElement('div');
      el.className = 'catalog-item r-' + mapRarity(skin.rarity?.id);
      el.innerHTML = `
        <img src="${skin.image}" alt="${skin.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="name">${skin.name}</div>
        <div class="price">🪙 ${(skin.rarity?.id === 'rarity_ancient_weapon' ? '5000' : '1500')}</div>
      `;
      grid.appendChild(el);
    });
    loading.style.display = 'none';
    grid.style.display = 'grid';
    cs2Loaded = true;
  } catch (err) {
    console.error(err);
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.innerHTML = `
      <p>Не удалось загрузить каталог CS2.</p>
      <p style="font-size:12px; margin-top:4px;">${err.message}</p>
      <button onclick="loadCS2Catalog(true)">Повторить</button>
    `;
  }
}

function mapRarity(id) {
  if (!id) return 'consumer';
  if (id.includes('common')) return 'consumer';
  if (id.includes('uncommon')) return 'industrial';
  if (id.includes('rare')) return 'milspec';
  if (id.includes('mythical')) return 'restricted';
  if (id.includes('legendary')) return 'classified';
  if (id.includes('ancient')) return 'covert';
  return 'consumer';
}

// Перезагрузка при повторной попытке
window.loadCS2Catalog = function(force) {
  if (force) { cs2Loaded = false; }
  loadCS2Catalog();
};

// ===== Cases (Главная) =====
const CASES = [
  { id: 'starter', name: 'Стартовый кейс', emoji: '📦', price: 100, items: [
    { name: 'P250 | Песок', rarity: 'consumer', value: 20, emoji: '🔫', weight: 40 },
    { name: 'MP9 | Пыль', rarity: 'consumer', value: 25, emoji: '💥', weight: 25 },
    { name: 'Five-SeveN | Кобальт', rarity: 'industrial', value: 60, emoji: '🔫', weight: 15 },
    { name: 'Galil AR | Синий', rarity: 'industrial', value: 80, emoji: '🎯', weight: 8 },
    { name: 'SG 553 | Волна', rarity: 'milspec', value: 200, emoji: '🎯', weight: 8 },
    { name: 'AK-47 | Синий ламинат', rarity: 'restricted', value: 600, emoji: '🎯', weight: 3.5 },
    { name: 'AWP | Азимов', rarity: 'classified', value: 2000, emoji: '🏹', weight: 0.45 },
    { name: '★ Нож-бабочка | Градиент', rarity: 'knife', value: 15000, emoji: '🔪', weight: 0.05 },
  ]},
  { id: 'standard', name: 'Боевой кейс', emoji: '🎁', price: 500, items: [
    { name: 'Glock-18 | Пустыня', rarity: 'consumer', value: 100, emoji: '🔫', weight: 25 },
    { name: 'UMP-45 | Лабиринт', rarity: 'consumer', value: 120, emoji: '💥', weight: 20 },
    { name: 'Desert Eagle | Бронза', rarity: 'industrial', value: 300, emoji: '🔫', weight: 20 },
    { name: 'M4A4 | Пустыня', rarity: 'industrial', value: 350, emoji: '🎯', weight: 15 },
    { name: 'AK-47 | Красная линия', rarity: 'milspec', value: 800, emoji: '🎯', weight: 12 },
    { name: 'M4A1-S | Синий гром', rarity: 'restricted', value: 2500, emoji: '🎯', weight: 6 },
    { name: 'AWP | Электрик', rarity: 'classified', value: 8000, emoji: '🏹', weight: 1.7 },
    { name: '★ Штык-нож | Кровавая паутина', rarity: 'knife', value: 40000, emoji: '🔪', weight: 0.3 },
  ]},
  { id: 'premium', name: 'Элитный кейс', emoji: '💎', price: 1500, items: [
    { name: 'MP7 | Кобальт', rarity: 'industrial', value: 500, emoji: '💥', weight: 20 },
    { name: 'FAMAS | Ночная', rarity: 'industrial', value: 600, emoji: '🎯', weight: 20 },
    { name: 'M4A4 | Гриффон', rarity: 'milspec', value: 1500, emoji: '🎯', weight: 25 },
    { name: 'AK-47 | Неонуар', rarity: 'milspec', value: 2000, emoji: '🎯', weight: 18 },
    { name: 'AWP | Феникс', rarity: 'restricted', value: 6000, emoji: '🏹', weight: 12 },
    { name: 'Desert Eagle | Принтстрим', rarity: 'classified', value: 15000, emoji: '🔫', weight: 4.5 },
    { name: '★ Керамбит | Синий', rarity: 'knife', value: 80000, emoji: '🗡️', weight: 0.5 },
  ]},
  { id: 'legendary', name: 'Легендарный кейс', emoji: '👑', price: 5000, items: [
    { name: 'AWP | Гиперзверь', rarity: 'restricted', value: 12000, emoji: '🏹', weight: 30 },
    { name: 'AK-47 | Огненный змей', rarity: 'restricted', value: 15000, emoji: '🎯', weight: 25 },
    { name: 'M4A4 | Кактус', rarity: 'classified', value: 35000, emoji: '🎯', weight: 20 },
    { name: 'Desert Eagle | Кровавая паутина', rarity: 'classified', value: 45000, emoji: '🔫', weight: 15 },
    { name: 'AWP | Драконье пламя', rarity: 'covert', value: 120000, emoji: '🏹', weight: 8 },
    { name: '★ Керамбит | Градиент', rarity: 'knife', value: 200000, emoji: '🗡️', weight: 1.5 },
    { name: '★ Нож-бабочка | Синий', rarity: 'knife', value: 250000, emoji: '🔪', weight: 0.5 },
  ]},
];

function renderCases() {
  const grid = document.getElementById('casesGrid');
  grid.innerHTML = '';
  for (const c of CASES) {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.innerHTML = `
      <div class="case-emoji">${c.emoji}</div>
      <div class="case-name">${c.name}</div>
      <div class="case-price">${c.price.toLocaleString('ru-RU')}</div>
      <button class="case-open" ${state.balance < c.price ? 'disabled' : ''} onclick="openCase('${c.id}')">Открыть</button>
    `;
    grid.appendChild(card);
  }
}

function openCase(caseId) {
  const caseData = CASES.find(c => c.id === caseId);
  if (!caseData) return;
  if (state.balance < caseData.price) { toast('Недостаточно монет', 'error'); return; }
  
  // Снимаем деньги
  state.balance -= caseData.price;
  // Выбираем предмет (взвешенный рандом)
  const totalWeight = caseData.items.reduce((s, i) => s + i.weight, 0);
  let r = Math.random() * totalWeight;
  let winner = caseData.items[caseData.items.length - 1];
  for (const item of caseData.items) {
    r -= item.weight;
    if (r <= 0) { winner = item; break; }
  }
  
  // Добавляем в инвентарь
  state.inventory.push({
    name: winner.name,
    rarity: winner.rarity,
    value: winner.value,
    emoji: winner.emoji
  });
  saveState();
  renderBalance();
  renderCases();
  
  toast(`Вы получили: ${winner.emoji} ${winner.name}`, 'success');
  // Здесь можно добавить модалку с анимацией (как в части 2)
}

// ===== Inventory =====
function renderInventory() {
  const grid = document.getElementById('inventoryGrid');
  grid.innerHTML = '';
  if (state.inventory.length === 0) {
    grid.innerHTML = '<div class="empty-state">Инвентарь пуст. Откройте первый кейс на главной!</div>';
    return;
  }
  state.inventory.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = `inv-item r-${item.rarity}`;
    el.innerHTML = `
      <div class="emoji">${item.emoji}</div>
      <div class="name">${item.name}</div>
      <button class="sell-btn" onclick="sellItem(${idx})">Продать · ${item.value.toLocaleString('ru-RU')} 🪙</button>
    `;
    grid.appendChild(el);
  });
}

function sellItem(idx) {
  const item = state.inventory[idx];
  if (!item) return;
  state.balance += item.value;
  state.inventory.splice(idx, 1);
  saveState();
  renderBalance();
  renderInventory();
  toast(`+${item.value.toLocaleString('ru-RU')} 🪙`, 'success');
}

// ===== Init =====
loadState();
renderBalance();
renderCases();
renderInventory();
</script>
</body>
</html>
